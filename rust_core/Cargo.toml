[package]
name = "zuma_core"
version = "0.1.0"
edition = "2021"
description = "Rust math/physics core for Macan Zuma-style orb game (PyO3 extension)"

[lib]
name = "zuma_core"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
